[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mean-field-execution"
version = "0.1.0"
description = "Auditable mean-field execution games with causal filtering and finite-population diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
meanfield-execution = "meanfield_execution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

